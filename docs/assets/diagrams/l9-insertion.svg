<text x="333.3333333333333" y="386" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="9" fill="#5b6270" text-anchor="start" font-weight="400">recognises the protocol and answers in</text>
<text x="333.3333333333333" y="397" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="9" fill="#5b6270" text-anchor="start" font-weight="400">schema</text>
<rect x="610.7" y="354.0" width="277.3" height="50.0" fill="#f7f8fa" stroke="#b9762a" stroke-width="1" rx="6"/>
<text x="622.6666666666666" y="372" font-family="IBM Plex Mono, Menlo, monospace" font-size="10.2" fill="#181a20" text-anchor="start" font-weight="700">helper scripts</text>
<text x="622.6666666666666" y="386" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="9" fill="#5b6270" text-anchor="start" font-weight="400">every merge, score and stop rule &#8212; the</text>
<text x="622.6666666666666" y="397" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="9" fill="#5b6270" text-anchor="start" font-weight="400">engine decides, not the LLM</text>
<text x="32" y="422" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="9.2" fill="#5b6270" text-anchor="start" font-weight="400">Guardrails, where you own the communication layer, turn the skill&#8217;s instructions into enforcement: an out-of-order message is rejected with a correction.</text>
