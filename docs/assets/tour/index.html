<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agents exchange replay</title>
<link rel="icon" href="data:,">
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#1b1f24; --muted:#6a737d; --line:#e1e4e8; --soft:#f0f2f5;
  --accent:#2563eb; --good:#15803d; --bad:#b91c1c; --warn:#b45309;
  --c-avatar:#64748b; --c-initiator:#0d9488; --c-accord:#ea580c; --c-concord:#0891b2;
  --c-microservices:#16a34a; --c-monolith:#7c3aed; --c-pragmatist:#dc2626;
  --shadow:0 1px 2px rgba(0,0,0,.06);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1318; --panel:#171c23; --ink:#e6e9ee; --muted:#8b95a3; --line:#2a313b; --soft:#1e252e;
    --accent:#60a5fa; --good:#4ade80; --bad:#f87171; --warn:#fbbf24;
    --c-avatar:#94a3b8; --c-initiator:#2dd4bf; --c-accord:#fb923c; --c-concord:#22d3ee;
    --c-microservices:#4ade80; --c-monolith:#a78bfa; --c-pragmatist:#f87171;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1318; --panel:#171c23; --ink:#e6e9ee; --muted:#8b95a3; --line:#2a313b; --soft:#1e252e;
  --accent:#60a5fa; --good:#4ade80; --bad:#f87171; --warn:#fbbf24;
  --c-avatar:#94a3b8; --c-initiator:#2dd4bf; --c-accord:#fb923c; --c-concord:#22d3ee;
  --c-microservices:#4ade80; --c-monolith:#a78bfa; --c-pragmatist:#f87171; --shadow:none;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{flex:none;display:flex;align-items:center;gap:16px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:15px;margin:0;font-weight:650}
header .meta{color:var(--muted);font-size:12.5px;min-width:0;flex:0 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{flex:none;white-space:nowrap}
header h1{white-space:nowrap}
header .grow{flex:1}
#trace{max-width:300px;text-overflow:ellipsis}
header h1{flex:none}
button,select{white-space:nowrap;font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{background:var(--soft)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;min-width:84px}
button.primary:hover{filter:brightness(1.08)}
main{flex:1;min-height:0;display:grid;grid-template-columns:250px minmax(0,1fr) 330px;grid-template-rows:minmax(0,1fr);overflow:hidden}
aside{background:var(--panel);overflow:auto;padding:14px}
aside.left{border-right:1px solid var(--line)}
aside.right{border-left:1px solid var(--line)}
h2{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:650}
.agent{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:10px;margin-bottom:2px;transition:background .2s}
.agent .av.sq{border-radius:8px}
.agent .av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;flex:none}
.agent .nm{font-weight:600;line-height:1.15}
.agent .st{font-size:11.5px;color:var(--muted)}
.agent.active{background:var(--soft)}
.agent.active .av{box-shadow:0 0 0 3px color-mix(in srgb,var(--col) 35%,transparent)}
.legend{margin-top:16px;font-size:12px;color:var(--muted)}
.legend p{margin:0 0 6px}
#chatwrap{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column}
#chat{flex:1;min-height:0;overflow:auto;padding:16px 22px 28px}
.banner{display:flex;align-items:center;gap:12px;margin:22px 0 12px;color:var(--muted)}
.banner:before,.banner:after{content:"";height:1px;background:var(--line);flex:1}
.banner .bt{font-weight:700;color:var(--ink);text-align:center}
.banner .bs{font-size:12px;text-align:center}
.banner.accord .bt{color:var(--c-accord)} .banner.concord .bt{color:var(--c-concord)}
.banner.v-ok .bt{color:var(--good)} .banner.v-bad .bt{color:var(--bad)} .banner.v-ok .bt,.banner.v-bad .bt{font-size:16px;letter-spacing:.04em} .banner.v-ok .bs,.banner.v-bad .bs{font-size:14px;margin-top:2px}
.banner .bw{font-size:14px;color:var(--ink);max-width:640px;margin:6px auto 0;text-align:center}
.msg{display:flex;gap:10px;margin:12px 0;max-width:880px;animation:in .25s ease-out}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.msg,.card{animation:none}}
.msg.reply{margin-left:44px}
.msg .av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;flex:none;margin-top:2px}
.bubble{background:var(--panel);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:9px 13px;min-width:0;box-shadow:var(--shadow);flex:0 1 auto;max-width:100%}
.msg.reply .bubble{border-left:3px solid var(--col)}
.msg.req .bubble{background:var(--soft)}
.who{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;margin-bottom:4px;font-size:12.5px}
.who b{color:var(--col)} .who .to{color:var(--muted)}
.kind{font:600 10.5px/1 ui-monospace,Menlo,monospace;padding:3px 6px;border-radius:6px;background:var(--soft);color:var(--muted);border:1px solid var(--line)}
.who .time{margin-left:auto;color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums}
.txt{white-space:pre-wrap;overflow-wrap:anywhere}
.md{overflow-wrap:anywhere;line-height:1.5}
.md>:first-child{margin-top:0}.md>:last-child{margin-bottom:0}
.md p{margin:.55em 0}
.md h3,.md h4,.md h5,.md h6{margin:.9em 0 .35em;line-height:1.25}
.md h3{font-size:1.12em}.md h4{font-size:1.05em}.md h5,.md h6{font-size:1em}
.md ul,.md ol{margin:.4em 0;padding-left:1.4em}.md li{margin:.15em 0}
.md li>ul,.md li>ol{margin:.15em 0}
.md code{font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;background:var(--soft);border:1px solid var(--line);border-radius:5px;padding:0 2px}
.md pre{margin:.5em 0}.md pre code{background:none;border:0;padding:0}
.md blockquote{margin:.5em 0;padding:.1em 0 .1em .8em;border-left:3px solid var(--line);color:var(--muted)}
.md hr{border:0;border-top:1px solid var(--line);margin:.8em 0}
.md table{display:block;overflow-x:auto;border-collapse:collapse;margin:.5em 0;font-size:.95em}
.md th,.md td{border:1px solid var(--line);padding:3px 8px;text-align:left;vertical-align:top}
.md th{background:var(--soft)}
.md a{color:inherit;text-decoration:underline}
.tour{border:1px solid var(--accent);border-left-width:4px;border-radius:10px;background:var(--panel);padding:12px 14px;margin:0 0 14px;box-shadow:var(--shadow)}
.tour .tpart{font:700 11px/1.2 system-ui,sans-serif;letter-spacing:.04em;text-transform:uppercase;color:var(--accent)}
.tour .tcount{font-size:11.5px;color:var(--muted);margin-top:2px}
.tour h3{margin:8px 0 6px;font-size:15px;line-height:1.3}
.tour .tbody{font-size:13px;line-height:1.5;overflow-wrap:anywhere}
.tour .tbody p{margin:.5em 0}.tour .tbody ul{margin:.4em 0;padding-left:1.3em}
.tour .tbody code{font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;background:var(--soft);border:1px solid var(--line);border-radius:5px;padding:0 3px}
.tour #tNext:disabled{opacity:.55;cursor:progress}
.tour .tprog{margin-top:10px;font-size:12px;color:var(--muted)}
.tour .tbar{height:6px;border-radius:4px;background:var(--soft);border:1px solid var(--line);overflow:hidden;margin-bottom:5px}
.tour .tbar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s ease}
.tour .tprog.ready{color:var(--good);font-weight:650}
.tour .tprog.ready .tbar i{background:var(--good)}
@keyframes tready{0%,100%{box-shadow:0 0 0 0 rgba(37,99,235,.55)}50%{box-shadow:0 0 0 6px rgba(37,99,235,0)}}
.tour #tNext.ready{animation:tready 1.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.tour #tNext.ready{animation:none}.tour .tbar i{transition:none}}
.tour .tnav{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.tour label{font-size:12px;color:var(--muted);display:flex;gap:5px;align-items:center;margin-top:8px}
.tour-hl{outline:3px solid #f5a524;outline-offset:3px;border-radius:12px}
body.rawmode .md{display:none}
body:not(.rawmode) .rawtxt{display:none}
pre,.mono{font:12px/1.45 ui-monospace,Menlo,Consolas,monospace}
pre{white-space:pre-wrap;overflow-wrap:anywhere;margin:6px 0 0;padding:9px 11px;background:var(--soft);border-radius:8px;border:1px solid var(--line)}
.clamp{max-height:170px;overflow:hidden;position:relative}
.clamp:after{content:"";position:absolute;left:0;right:0;bottom:0;height:46px;background:linear-gradient(transparent,var(--panel))}
.msg.req .clamp:after{background:linear-gradient(transparent,var(--soft))}
.more{margin-top:6px;font-size:12px;padding:3px 9px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
.chip{font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--soft);border:1px solid var(--line)}
.atoms{margin:6px 0 0;padding:0;list-style:none;display:grid;gap:5px}
.atoms li{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start}
.t{font:700 9.5px/1 ui-monospace,Menlo,monospace;text-transform:uppercase;letter-spacing:.04em;padding:4px 6px;border-radius:5px;color:#fff;margin-top:2px;white-space:nowrap}
.t.objective{background:#2563eb}.t.constraint{background:#b45309}.t.assumption{background:#6b7280}.t.sub_goal{background:#0f766e}.t.deliverable{background:#7c3aed}
table.kv{border-collapse:collapse;width:100%;margin-top:6px}
table.kv td,table.kv th{border-top:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}
table.kv th{width:96px;color:var(--muted);font-weight:600;font-size:12px}
.big{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.raw{display:flex;gap:18px;margin:4px 0}
.raw div span{display:block;font-size:11px;color:var(--muted)}
.typing{display:flex;gap:10px;margin:12px 0 12px 44px;color:var(--muted);align-items:center;font-size:12.5px}
.dots i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted);margin-right:3px;animation:b 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.25;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.card{margin:12px 0 12px 44px;max-width:840px;border:1px dashed var(--col);border-radius:10px;padding:8px 12px;background:color-mix(in srgb,var(--col) 7%,var(--panel));animation:in .25s ease-out}
.card .h{display:flex;gap:8px;align-items:center;font-size:12px;font-weight:650;color:var(--col)}
.card .h code{font:600 11.5px ui-monospace,Menlo,monospace}
.card ul{margin:5px 0 0;padding-left:18px}
.card li{margin:1px 0}
.note{margin:14px 0 14px 44px;max-width:840px;border-left:3px solid var(--c-initiator);padding:6px 12px;background:var(--soft);border-radius:0 8px 8px 0}
.note .h{font-size:12px;font-weight:650;color:var(--c-initiator);margin-bottom:3px}
.note .txt{font-size:13px}
footer{flex:none;background:var(--panel);border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
footer input[type=range]{flex:1;min-width:160px;accent-color:var(--accent)}
.pos{font-size:12px;color:var(--muted);min-width:96px;text-align:right;font-variant-numeric:tabular-nums}
.sec{margin-bottom:18px}
.kvl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12.5px}
.kvl b{color:var(--muted);font-weight:600}
.pill{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);background:var(--soft);margin:1px 3px 1px 0}
.pill.ok{border-color:var(--good);color:var(--good)} .pill.bad{border-color:var(--bad);color:var(--bad)}
.flag{font-size:12px;margin:3px 0;color:var(--warn)}
table.mx{border-collapse:collapse;width:100%;font-size:12px;font-variant-numeric:tabular-nums}
table.mx th,table.mx td{padding:4px 5px;border-bottom:1px solid var(--line);text-align:center}
table.mx th:first-child,table.mx td:first-child{text-align:left;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell{border-radius:6px;padding:1px 6px;font-weight:600}
.empty{color:var(--muted);font-size:12.5px}
@media (max-width:1100px){main{grid-template-columns:230px minmax(0,1fr)}aside.right{display:none}}
@media (max-width:720px){header{flex-wrap:wrap;gap:8px}header .meta{display:none}header h1{font-size:14px}main{grid-template-columns:1fr}aside.left{display:none}#chat{padding:12px}.msg.reply,.typing,.card,.note{margin-left:0}}
#graph svg{width:100%;height:auto;display:block}
.card .clamp:after{background:linear-gradient(transparent,color-mix(in srgb,var(--col) 7%,var(--panel)))}
.gcap{font-size:12.5px;margin-top:6px;min-height:40px}
.gcap b{font-weight:650}.gcap .m{color:var(--muted);font-size:11.5px}
.flow{stroke-dasharray:5 4;animation:dash .7s linear infinite}
@keyframes dash{to{stroke-dashoffset:-9}}
@media (prefers-reduced-motion:reduce){.flow{animation:none}}
</style>
</head>
<body>
<header>
  <h1 id="title">Agents exchange replay</h1>
  <span class="meta" id="meta"></span>
  <span class="grow"></span>
  <select id="trace" aria-label="Choose a trace"></select>
  <button id="open" title="Open a trace .json file (or drop it on the page)">Open trace file</button>
  <input id="file" type="file" accept=".json,application/json" hidden>
  <button id="jumpA" title="Jump to the start of ACCORD">ACCORD</button>
  <button id="jumpC" title="Jump to the start of CONCORD">CONCORD</button>
  <button id="jumpR" title="Jump to the result">Result</button>
  <button id="tourBtn" class="primary" hidden title="Guided tour: walk through the runs with an explanation of each step">Tour</button>
  <button id="md" title="Show the agents' messages rendered as markdown, or as the exact text" aria-pressed="true">Markdown</button>
  <button id="theme" title="Toggle light or dark">Theme</button>
</header>
<main>
  <aside class="left" aria-label="Agents">
    <h2>Agents</h2>
    <p class="gcap" id="about" style="margin:0 0 8px"></p>
    <div id="agents"></div>
    <h2 style="margin-top:18px">Interaction graph</h2>
    <div id="graph"></div>
    <div id="gcap" class="gcap"></div>
  </aside>
  <div id="chatwrap"><div id="chat" role="log" aria-live="polite"></div></div>
  <aside class="right" aria-label="State">
    <div class="tour" id="tour" hidden>
      <div class="tpart" id="tPart"></div>
      <div class="tcount" id="tCount"></div>
      <h3 id="tTitle"></h3>
      <div class="tbody" id="tText"></div>
      <div class="tprog" id="tProg" role="status" aria-live="polite"><div class="tbar"><i id="tBar"></i></div><span id="tProgText"></span></div>
      <div class="tnav">
        <button id="tBack">Back</button>
        <button class="primary" id="tNext">Next</button>
        <button id="tExit">Exit tour</button>
      </div>
      <label><input type="checkbox" id="tAuto"> Auto-advance</label>
    </div>
    <div class="sec" id="secAccord"><h2>ACCORD</h2><div id="sAccord" class="empty">Not started.</div></div>
    <div class="sec" id="secConcord"><h2>CONCORD</h2><div id="sConcord" class="empty">Not started.</div></div>
    <div id="secGeneric" hidden></div>
  </aside>
</main>
<footer>
  <button class="primary" id="play">Play</button>
  <button id="step" title="Show the next message">Next</button>
  <button id="restart">Restart</button>
  <label class="meta">Speed
    <select id="speed">
      <option value="demo" selected>Demo pace</option>
      <option value="real">Real time</option>
      <option value="x10">10x real</option>
      <option value="instant">Instant</option>
    </select>
  </label>
  <input id="scrub" type="range" min="0" value="0" aria-label="Position in the replay">
  <span class="pos" id="pos"></span>
</footer>
<script id="data" type="application/json">{"format": "agentbridge-replay/1", "traces": []}</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const TR = D.traces.slice();
let cur = 0, E = [], M = {title:"Agents exchange replay", calls:0, minutes:0, outcome:"-", archive:""};
if(TR.length){ E = TR[0].events; M = TR[0].meta; }
window.__TR = TR;
const AG0 = {
  avatar:{name:"You",ini:"Y",col:"var(--c-avatar)",st:"human"},
  initiator:{name:"initiator",ini:"IN",col:"var(--c-initiator)",st:"coordinator · Claude Code"},
  "accord.py":{name:"accord.py",ini:"AC",col:"var(--c-accord)",st:"local script"},
  "concord.py":{name:"concord.py",ini:"CO",col:"var(--c-concord)",st:"local script"},
  microservices:{name:"microservices",ini:"MS",col:"var(--c-microservices)",st:"specialist · Claude Code"},
  monolith:{name:"monolith",ini:"MO",col:"var(--c-monolith)",st:"specialist · Claude Code"},
  pragmatist:{name:"pragmatist",ini:"PR",col:"var(--c-pragmatist)",st:"specialist · Claude Code"}
};
const ORDER0 = ["avatar","initiator","microservices","monolith","pragmatist"];
const ABOUT0 = "The initiator and the three specialists are each a separate Claude Code instance (<code>claude --print</code>), connected through agentbridge over SLIM.";
let AG = Object.assign({}, AG0), ORDER = ORDER0;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const chat = $("#chat");
let shown = 0, playing = false, token = 0, typingEl = null;
// any id the trace does not declare still gets a usable row
const ag = k => AG[k] || (AG[k] = {name:String(k), ini:String(k).slice(0,2).toUpperCase(), col:"var(--c-avatar)", st:""});

function applyMeta(){
  $("#title").textContent = M.title;
  $("#meta").title = $("#meta").textContent = M.calls ? `${M.calls} messages out and back, ${M.minutes} min live, outcome ${M.outcome} (${M.archive})` : "";
  document.title = M.title;
  // a trace may declare its own participants (meta.agents, meta.order, meta.about); otherwise the ACCORD/CONCORD set
  AG = Object.assign({}, AG0, M.agents || {});
  ORDER = M.order || (M.agents ? Object.keys(M.agents) : ORDER0);
  $("#about").innerHTML = M.about ? esc(M.about) : ABOUT0;
  $("#agents").innerHTML = ORDER.map(agentRow).join("");
  layoutGraph();
  const has = re => E.some(e => e.type === "banner" && re.test(e.title || ""));
  $("#jumpA").hidden = !E.some(e => e.type === "banner" && e.phase === "accord");
  $("#jumpC").hidden = !E.some(e => e.type === "banner" && e.phase === "concord" && /^(Stage 2|CONCORD$)/.test(e.title));
  $("#jumpR").hidden = !has(/^Result$/);
  // the generic panel only for traces that fill it; ACCORD/CONCORD and baseline traces keep the original two sections
  const generic = E.some(e => e.state && e.state.panel);
  // a generic-panel trace (mas-lab) still gets the ACCORD/CONCORD sections when it carries their state
  $("#secAccord").hidden = generic && !E.some(e => e.state && e.state.accord);
  $("#secConcord").hidden = generic && !E.some(e => e.state && e.state.concord);
  $("#secGeneric").hidden = !generic;
  // there they go under the generic panel (after Activity); other traces keep the original order
  const right = $("aside.right"), G = $("#secGeneric");
  if(generic) right.append($("#secAccord"), $("#secConcord"));
  else if(G.compareDocumentPosition($("#secAccord")) & Node.DOCUMENT_POSITION_FOLLOWING){ right.insertBefore($("#secAccord"), G); right.insertBefore($("#secConcord"), G); }
}
function fillPicker(){
  const sel = $("#trace");
  sel.innerHTML = TR.map((t, i) => `<option value="${i}">${esc(t.meta.label || t.meta.archive || ("trace " + (i+1)))}</option>`).join("");
  sel.value = cur; sel.style.display = TR.length > 1 ? "" : "none";
}
function agentRow(k){
  const a = ag(k), sq = k.endsWith(".py");
  return `<div class="agent" id="ag-${k.replace('.','_')}" style="--col:${a.col}"><div class="av${sq?' sq':''}" style="background:${a.col}">${esc(a.ini)}</div><div><div class="nm">${esc(a.name)}</div><div class="st">${esc(a.st)}</div></div></div>`;
}
function setActive(k){
  document.querySelectorAll(".agent").forEach(e => e.classList.remove("active"));
  if(k){ const e = $("#ag-" + k.replace('.','_')); if(e) e.classList.add("active"); }
}
function mmss(t){ t = Math.max(0, Math.round(t)); return "+" + Math.floor(t/60) + ":" + String(t%60).padStart(2,"0"); }

/* ---------- body rendering ---------- */
function tryJSON(s){ try { return JSON.parse(s); } catch(e){ return null; } }
function parseXML(s){
  const d = new DOMParser().parseFromString(s, "text/xml");
  return d.querySelector("parsererror") ? null : d;

const sleep = ms => new Promise(r => setTimeout(r, ms));
function mode(){ return $("#speed").value; }
function typingMs(e){
  const m = mode();
  if(m === "instant") return 0;
  if(m === "real") return e.latency * 1000;
  if(m === "x10") return e.latency * 100;
  return Math.min(2600, 700 + Math.log2(1 + e.latency) * 300);
}
function readMs(e){
  const m = mode();
  if(m === "instant") return 0; if(m === "real") return 150; if(m === "x10") return 120;
  const len = (e.text || "").length + (e.lines ? e.lines.join("").length : 0);
  return e.type === "banner" ? 700 : Math.min(3600, 450 + len * 0.9);
}
async function showNext(my, skipRead){
  const e = E[shown]; if(!e) return;
  if(e.type === "msg" && e.dir === "reply" && typingMs(e) > 0){ typingOn(e.from); await sleep(typingMs(e)); if(my !== token) return; }
  if(my !== token) return;
  append(e); shown++; sync();
  if(typeof tourProgress === "function") tourProgress();
  scrollEnd();
  if(!skipRead) await sleep(readMs(e));
}
async function run(){
  const my = ++token; playing = true; $("#play").textContent = "Pause";
  while(playing && my === token && shown < E.length) await showNext(my);
  if(my === token){ playing = false; $("#play").textContent = shown >= E.length ? "Replay" : "Play"; }
}
function pause(){ playing = false; token++; typingOff(); $("#play").textContent = shown >= E.length ? "Replay" : "Play"; }
function rebuild(n){

}
function sync(){

}

/* ---------- fetch mode: build the events in the browser from an archive folder ---------- */
const stripAnsi = s => s.replace(/\x1b\[[0-9;]*m/g, "");
const unent = s => s.replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&amp;/g,"&");
async function getText(url){ try { const r = await fetch(url); return r.ok ? await r.text() : null; } catch(e){ return null; } }
async function getJSON(url){ const t = await getText(url); try { return t ? JSON.parse(t) : null; } catch(e){ return null; } }

  const gj = f => want(f) ? getJSON(dir + f) : Promise.resolve(null);
  const gt = f => want(f) ? getText(dir + f) : Promise.resolve(null);
  const ex = await getText(dir + "exchange.jsonl");
  if(!ex) throw new Error("could not fetch " + dir + "exchange.jsonl");
  const recs = ex.split("\n").filter(l => l.trim()).map(l => JSON.parse(l));
  if(!recs.length) throw new Error("exchange.jsonl is empty");
  // optional sibling files: anything missing just means fewer cards
  const [acc, contract, certTxt, initlog, runlog] = await Promise.all([
    gj("state/accord-state.json"), gj("state/intent_contract.json"), gt("state/certificate.txt"),
    gt("logs/initiator.log"), gt("logs/run-pipeline.log")]);
  // certificate: the file if the run saved one, else the one the initiator printed in its final report
  const cert = certTxt || (runlog ? (/<concord-certificate>[\s\S]*?<\/concord-certificate>/.exec(stripAnsi(runlog)) || [null])[0] : null);

    final: [...cert.matchAll(/<score agent="(\w+)" value="([\d.]+)" status="([\w-]+)"/g)].map(m => [m[1], m[2], m[3]]),
    log: [...cert.matchAll(/<round t="(\d+)" incumbent="([^"]+)" floor="([\d.]+)" accepted="(\w+)" why="([^"]*)"/g)].map(m => ({t:+m[1], x:m[2], floor:parseFloat(m[3]), acc:m[4]==="true", why:unent(m[5])})),

  const hasAccord = recs.some(r => /^\s*[A-Z_]+_REQUEST/.test(r.prompt || ""));

  const hasProtocol = hasAccord || hasConcord;
  const hasClarify = recs.some(r => kindOf(r) === "CLARIFY_REQUEST");
  add({type:"banner", title:"Kickoff", sub: hasAccord ? "The task goes to the initiator. It is not told which protocol to use after ACCORD." : hasConcord ? "The task goes to the initiator, told to use CONCORD only. No ACCORD first." : "The initiator relays messages between the task and the specialists. No ACCORD, no CONCORD."});
  add({type:"msg", dir:"req", from:"avatar", to:"initiator", kind:"KICKOFF", phase:hasAccord ? "accord" : hasConcord ? "concord" : "", text:kick, t:0, latency:0, call:0});
  if(hasAccord) add({type:"banner", title:"Stage 1: ACCORD", sub:"Share the problem. Nobody negotiates; accord.py only merges.", phase:"accord"});
  else if(!hasConcord) add({type:"banner", title:"Relay, no protocol", sub:"The initiator sends the messages itself. No coordination protocol is loaded."});
  if(acc) add({type:"tool", tool:"accord.py", title:"init", lines:[`specialists: ${acc.specialists.join(", ")}`, `key terms: ${acc.key_terms.join(", ")}`, `action step: ${acc.action_tool}`], state:{accord:{specialists:acc.specialists}}});

                    : {type:"banner", phase:"concord", title:"CONCORD", sub:"Anchors, seeds, scores and repairs until a certificate."});
      const nm = hasAccord ? NOTE_RE.exec(report) : null;
      if(nm) add({type:"note", from:"initiator", title:"The initiator's own account, from its final report", text:nm[1].trim()});

      const extra = {};

      add(Object.assign({type:"msg", dir:"reply", from:r.to, to:"initiator", kind:kd, phase:concord ? "concord" : "accord", text:b, t:rel(r.t_end), latency:rel(r.t_end) - rel(r.t_start), call:c}, extra));

      const names = (contract.roster || []).map(q => q.identity);
      add({type:"tool", tool:"accord.py", title:"roster", lines:[`roster of ${names.length}: ${names.join(", ")}`], state:{accord:{roster:names}}});
    } else if(k === "FRAME_REQUEST"){
      frameRound++;
      const fo = (await gj(`state/frame${frameRound}_out.json`)) || (await gj(`state/out_frame${frameRound}.json`));
      if(fo){ const d = fo.data; add({type:"tool", tool:"accord.py", title:`frame, round ${frameRound}`, lines:[`${d.atoms.length} merged atoms (${d.new_this_round} new observations)`, `estimated coverage ${d.coverage.coverage.toFixed(2)}, stop = ${d.stop ? "True" : "False"}`], state:{accord:{frame:{round:frameRound, atoms:d.atoms.length, new:d.new_this_round}}}}); }

      add({type:"tool", tool:"accord.py", title:"glossary", lines:gl.map(g => `${g.term}: ${g.status} (${(g.variants||[]).length} variants)`).concat(hasClarify ? [] : ["no ambiguous pairs, so no CLARIFY"]), state:{accord:{glossary:gl.map(g => ({term:g.term, status:g.status}))}}});

                label:`${name}: ${cs ? cs.outcome + ", " + cs.winner + ", " : (hasProtocol ? "" : "relay only, ")}${recs.length} calls, ${minutes} min`,
                calls:recs.length, minutes, outcome:cs ? cs.outcome : (hasProtocol ? "unknown" : "no protocol"), winner:cs ? cs.winner : "", archive:name};

async function loadTrace(i){

    try {

      else t = await buildFromArchive(TR[i].dir, TR[i].has);

addEventListener("dragover", e => e.preventDefault());
addEventListener("drop", e => { e.preventDefault(); const f = e.dataTransfer.files[0]; if(f) openFile(f); });
applyMeta(); fillPicker();
function applyHash(){
  const h = new URLSearchParams(location.hash.slice(1));
  if(h.get("speed")) $("#speed").value = h.get("speed");
  if(h.get("trace") && TR[+h.get("trace")] && TR[+h.get("trace")].events){ cur = +h.get("trace"); E = TR[cur].events; M = TR[cur].meta; applyMeta(); $("#scrub").max = E.length; $("#trace").value = cur; }
  $("#scrub").max = E.length;
  if(h.get("at")) rebuild(Math.min(E.length, +h.get("at"))); else sync();
  if(h.has("play")) run();
}
/* ---------- guided tour: tour.json (next to index.html) lists, per trace, steps anchored to events ---------- */
let TOUR = null, tour = null, tourTimer = null;
async function loadTourFile(){
  const j = await getJSON("tour.json");
  if(!j || !Array.isArray(j.parts) || !j.parts.length) return;
  TOUR = j; $("#tourBtn").hidden = false;
  const h = new URLSearchParams(location.hash.slice(1));
  if(h.has("tour")) startTour(h.get("tour") === "auto");
}
// an anchor matches events by field; title is a prefix match; nth picks the n-th match, last the final one
function tourIdx(at){
  const hit = [];
  E.forEach((e, i) => { if(Object.keys(at).every(k => k === "nth" || k === "last" ? true : k === "title" ? String(e.title || "").startsWith(at.title) : e[k] === at[k])) hit.push(i); });
  if(!hit.length) return -1;
  return at.last ? hit[hit.length - 1] : (hit[(at.nth || 1) - 1] ?? -1);
}
async function tourEnter(p){
  const part = TOUR.parts[p];
  const i = TR.findIndex(t => String(t.dir || "").includes(part.trace));
  if(i < 0){ toast("Tour trace not found: " + part.trace); return tourExit(); }
  const auto = tour ? tour.auto : false;
  await loadTrace(i);
  if(!new URLSearchParams(location.hash.slice(1)).get("speed")) $("#speed").value = "demo";
  const steps = part.steps.map(s => ({...s, idx: tourIdx(s.at)})).filter(s => s.idx >= 0).sort((a, b) => a.idx - b.idx);
  tour = {p, steps, s:-1, auto};
  renderTour();
}
// progress of the current step: a bar and a line of text while the chat plays, and a clear "ready" state
function setProg(state, done, total){
  const ready = state === "ready";
  $("#tProg").classList.toggle("ready", ready);
  $("#tNext").classList.toggle("ready", ready);
  $("#tBar").style.width = (ready ? 100 : total ? Math.round(100 * done / total) : 0) + "%";
  const next = $("#tNext").textContent;
  const final = tour && tour.p === TOUR.parts.length - 1 && tour.s === tour.steps.length - 1;
  $("#tProgText").textContent = !ready ? `Playing the exchange: ${done} of ${total} messages`
    : tour && tour.s < 0 ? `Ready. Click ${next} to begin.`
    : final ? `That was the last step. Click ${next} to close the tour.`
    : `Done. Click ${next} to continue.`;
}
function tourProgress(){ if(tour && tour.total) setProg("play", Math.min(shown - tour.start, tour.total), tour.total); }
// the explanation shows as soon as the step is chosen; tourSettled() runs once the chat has caught up
function renderTour(animating){
  clearTimeout(tourTimer);
  const part = TOUR.parts[tour.p], lastPart = tour.p === TOUR.parts.length - 1;
  const st = tour.s < 0 ? part.intro : tour.steps[tour.s];
  const lastStep = tour.s === tour.steps.length - 1;
  $("#tour").hidden = false;
  $("#tPart").textContent = part.label || ("Part " + (tour.p + 1));
  $("#tCount").textContent = tour.s < 0 ? "Introduction" : `Step ${tour.s + 1} of ${tour.steps.length}`;
  $("#tTitle").textContent = st.title;
  $("#tText").innerHTML = md(st.text);
  $("#tBack").disabled = tour.s < 0;
  $("#tNext").textContent = tour.s < 0 ? "Start" : lastStep ? (lastPart ? "Finish" : "Next part") : "Next";
  $("#tAuto").checked = tour.auto;
  document.querySelectorAll(".tour-hl").forEach(e => e.classList.remove("tour-hl"));
  document.querySelector("aside.right").scrollTop = 0;
  if(!animating) tourSettled();
}
function tourSettled(){
  tour.total = 0; setProg("ready");
  const st = tour.s < 0 ? TOUR.parts[tour.p].intro : tour.steps[tour.s];
  if(tour.s >= 0 && chat.lastElementChild) chat.lastElementChild.classList.add("tour-hl");
  if(tour.auto) tourTimer = setTimeout(tourNext, Math.min(18000, 3000 + st.text.length * 30));
}
async function tourNext(){
  if(!tour) return;
  clearTimeout(tourTimer);
  if(tour.s === tour.steps.length - 1){
    if(tour.p < TOUR.parts.length - 1) return tourEnter(tour.p + 1);
    return tourExit();
  }
  const target = tour.steps[tour.s + 1].idx;
  tour.start = shown; tour.total = Math.max(1, target + 1 - shown);
  tour.s++; renderTour(true); setProg("play", 0, tour.total);
  const my = ++token; playing = true; $("#play").textContent = "Pause"; $("#tNext").disabled = true;
  while(playing && my === token && shown <= target) await showNext(my, shown === target);
  $("#tNext").disabled = false;
  if(!tour || my !== token) return;
  playing = false; $("#play").textContent = "Play";
  tourSettled();
}
function tourBack(){
  if(!tour || tour.s < 0) return;
  clearTimeout(tourTimer); pause(); $("#tNext").disabled = false;
  tour.s--; rebuild(tour.s < 0 ? 0 : tour.steps[tour.s].idx + 1); renderTour();
}
function tourExit(){
  if(!tour) return;
  clearTimeout(tourTimer); tour = null;
  $("#tour").hidden = true;
  document.querySelectorAll(".tour-hl").forEach(e => e.classList.remove("tour-hl"));
}
function startTour(auto){
  if(!TOUR) return;
  if(matchMedia("(max-width:1100px)").matches){ toast("Widen the window to at least 1100px to see the explanations."); return; }
  pause(); tour = {p:0, steps:[], s:-1, auto:!!auto}; tourEnter(0);
}
$("#tourBtn").addEventListener("click", () => startTour(false));
$("#tNext").addEventListener("click", tourNext);
$("#tBack").addEventListener("click", tourBack);
$("#tExit").addEventListener("click", tourExit);
$("#tAuto").addEventListener("change", e => { if(tour){ tour.auto = e.target.checked; renderTour(); } });
// using any player control by hand leaves the tour
["#play", "#step", "#restart", "#jumpA", "#jumpC", "#jumpR"].forEach(sel => $(sel).addEventListener("click", tourExit, true));
$("#scrub").addEventListener("input", tourExit, true); $("#trace").addEventListener("change", tourExit, true);

// deep links: #trace=N, #at=N (show the first N events instantly), #speed=..., #play
$("#scrub").max = E.length;
if(TR.length){ applyHash(); }
else { bootFetch().then(async ok => { if(ok){ applyHash(); await loadTourFile(); } window.__ready = true; }); }
window.__ready = TR.length > 0;
</script>
