site_name: IoC Cognition Protocols
site_description: ACCORD and CONCORD — the L9 Cognition Protocol family for multi-agent systems.
site_url: https://ioc-project.github.io/ioc-cognition-protocols/
repo_url: https://github.com/ioc-project/ioc-cognition-protocols
repo_name: ioc-project/ioc-cognition-protocols
edit_uri: edit/main/docs/
copyright: Internet of Cognition Project. Open specification.

theme:
  name: material
  language: en
  font:
    text: Inter
    code: Roboto Mono
  logo: assets/outshift-logo.svg
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
  palette:
    scheme: slate
    primary: black
    accent: cyan

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [docs]
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

hooks:
  - docs/hooks.py

plugins:
  - search

extra_css:
  - assets/extra.css

extra_javascript:
  - assets/consumption-modes.js
  - assets/architecture-toggle.js

nav:
  - Home: index.md
  - Cognition Protocols:
      - cognition-protocols/index.md
      - Design Requirements: cognition-protocols/design-requirements.md
      - Installation: cognition-protocols/installation.md
      - ACCORD:
          - cognition-protocols/accord/index.md
          - Design: cognition-protocols/accord/design.md
      - CONCORD:
          - cognition-protocols/concord/index.md
          - Design: cognition-protocols/concord/design.md
          - Configuration: cognition-protocols/concord/configuration.md
          - Specification: cognition-protocols/concord/specification.md
  - Evaluation:
      - evaluation/index.md
      - ACCORD: evaluation/accord.md
      - CONCORD: evaluation/concord.md
  - Tutorials and Demos:
      - cognition-protocols/tutorials/index.md
      - Coding Architect Team: cognition-protocols/tutorials/coding-architect-team.md
      - Hiddenbench: cognition-protocols/tutorials/hiddenbench.md
      - E-Commerce: cognition-protocols/tutorials/e-commerce.md
      - SRE Triage: cognition-protocols/tutorials/sre-triage.md
      - Customer renewal discount: cognition-protocols/tutorials/customer-renewal-discount.md
