[package]
name = "ioc-accord"
version = "0.1.0"
edition.workspace = true
rust-version = "1.89"
description = "ACCORD protocol library."
license.workspace = true
readme = "README.md"
repository.workspace = true
keywords = ["accord", "multi-agent", "consensus", "protocol"]
categories = ["algorithms"]

[lib]
name = "ioc_accord"

[features]
# The `ioc-accord` command as a library function (module `cli`): the commands of `accord_initiator.py`, with their arguments, their
# output and the state file they keep.
cli = ["dep:clap"]

# Runs the command with the arguments, the environment and the input of the process (the differential test drives it); not shipped.
[[example]]
name = "ioc-accord"
path = "examples/ioc-accord.rs"
required-features = ["cli"]

[dependencies]
indexmap = { version = "2", features = ["serde"] }
# What the protocol libraries share: the message format (fences, escaping, the check) and the state storage. The version is for crates.io.
ioc-protocol = { version = "0.1.0", path = "../ioc-protocol-rs" }
# Without the other speed features, for size, as in ioc-concord. The one pattern is the delivery check of a reply (messages.rs).
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf-dfa"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# v4: the id of a session. (The isolated path of a state file under a run key is ioc_protocol::path::keyed_path.)
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"], optional = true }
