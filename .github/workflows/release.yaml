name: release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      paths_released: ${{ steps.release.outputs.paths_released }}
      prs: ${{ steps.release.outputs.prs }}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ vars.IOC_AUTOMATION_BOT_APP_ID }}
          private-key: ${{ secrets.IOC_AUTOMATION_BOT_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          target-branch: main
          config-file: .github/release-config.json
          manifest-file: .github/release-manifest.json

  publish-release-assets:
    needs: release-please
    if: ${{ needs.release-please.outputs.paths_released != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        path: ${{ fromJson(needs.release-please.outputs.paths_released) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Upload concord-spec release assets
        if: ${{ matrix.path == 'protocols/concord/spec' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(jq -r '."protocols/concord/spec"' .github/release-manifest.json)"
          tag="concord-spec-v${version}"
          gh release upload "$tag" protocols/concord/spec/CONCORD-SPEC.md --clobber
          gh release upload "$tag" docs/protocols/concord/spec/CONCORD-SPEC.html --clobber

      - name: Zip skill and upload to its release
        if: ${{ contains(matrix.path, '/skills/') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="$(basename "${{ matrix.path }}")"
          version="$(jq -r --arg path "${{ matrix.path }}" '.[$path]' .github/release-manifest.json)"
          tag="${name}-v${version}"
          zip -r "${name}.zip" "${{ matrix.path }}"
          gh release upload "$tag" "${name}.zip" --clobber

  update-ai-catalog:
    needs: release-please
    if: ${{ needs.release-please.outputs.prs != '' && needs.release-please.outputs.prs != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        pr: ${{ fromJson(needs.release-please.outputs.prs) }}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ vars.IOC_AUTOMATION_BOT_APP_ID }}
          private-key: ${{ secrets.IOC_AUTOMATION_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ matrix.pr.headBranchName }}
          fetch-depth: 0

      - name: Add new skill versions to ai-catalog.json
        env:
          REPO: ${{ github.repository }}
          BASE_BRANCH: ${{ matrix.pr.baseBranchName }}
        run: |
          python3 - <<'PYEOF'
          import json, re, os, subprocess, yaml
          from pathlib import Path
          from datetime import datetime, timezone

          catalog_path = Path("docs/ai-catalog.json")
          manifest_path = Path(".github/release-manifest.json")
          repo = os.environ["REPO"]

          manifest = json.loads(manifest_path.read_text())
          base_manifest = json.loads(subprocess.check_output(
              ["git", "show", f"origin/{os.environ['BASE_BRANCH']}:{manifest_path}"], text=True
          ))
          catalog = json.loads(catalog_path.read_text())

          existing = {(e["identifier"], e.get("version")) for e in catalog["entries"]}
          changed = False

          for skill_path, version in manifest.items():
              # only skills released by this PR, i.e. bumped relative to the base branch
              if base_manifest.get(skill_path) == version:
                  continue

              name = Path(skill_path).name
              identifier = f"urn:air:ioc-project:skill:{name}"

              if (identifier, version) in existing:
                  continue

              skill_md = Path(skill_path) / "SKILL.md"
              content = skill_md.read_text()
              fm = re.split(r'^---\s*$', content, maxsplit=2, flags=re.MULTILINE)
              data = yaml.safe_load(fm[1])
              description = str(data.get("description", "")).strip()

              tag = f"{name}-v{version}"
              asset_url = f"https://github.com/{repo}/releases/download/{tag}/{name}.zip"
              now = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")

              catalog["entries"].append({
                  "identifier": identifier,
                  "displayName": name,
                  "version": version,
                  "type": "application/agent-skills+zip",
                  "description": description,
                  "tags": ["skill", "claude-code"],
                  "url": asset_url,
                  "updatedAt": now
              })
              changed = True
              print(f"Added entry: {identifier} {version}")

          if changed:
              catalog_path.write_text(json.dumps(catalog, indent=2) + "\n")
          else:
              print("No new entries needed")
          PYEOF

      - name: Commit catalog update to PR branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          user_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add docs/ai-catalog.json
          git diff --cached --quiet && exit 0
          git commit -s -m "chore: update ai-catalog.json for new skill versions"
          git push

  update-concord-spec-html:
    needs: release-please
    if: ${{ needs.release-please.outputs.prs != '' && needs.release-please.outputs.prs != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        pr: ${{ fromJson(needs.release-please.outputs.prs) }}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ vars.IOC_AUTOMATION_BOT_APP_ID }}
          private-key: ${{ secrets.IOC_AUTOMATION_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ matrix.pr.headBranchName }}

      - name: Regenerate CONCORD-SPEC.html if spec changed in this PR
        run: |
          # Only act when this release PR touches the concord-spec package
          if ! git diff --name-only origin/${{ matrix.pr.baseBranchName }} | grep -q '^protocols/concord/spec/'; then
            echo "No concord-spec changes in this PR, skipping"
            exit 0
          fi
          python protocols/concord/spec/generate_respec.py \
            protocols/concord/spec/CONCORD-SPEC.md \
            -o docs/protocols/concord/spec/CONCORD-SPEC.html

      - name: Commit rendered HTML to PR branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          user_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add docs/protocols/concord/spec/CONCORD-SPEC.html
          git diff --cached --quiet && exit 0
          git commit -s -m "chore(concord): regenerate CONCORD-SPEC.html"
          git push
