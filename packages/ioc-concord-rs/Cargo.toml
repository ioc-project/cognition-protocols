[package]
name = "ioc-concord"
version = "0.2.0"
edition.workspace = true
rust-version = "1.89"
description = "CONCORD protocol library."
license.workspace = true
readme = "README.md"
repository.workspace = true
keywords = ["concord", "multi-agent", "negotiation", "protocol"]
categories = ["algorithms"]

[lib]
crate-type = ["lib", "cdylib"]

[features]
# The API for other languages (Python, Go, JavaScript, ...), through UniFFI: module `ffi`. Without it this is a plain Rust crate.
uniffi = ["dep:uniffi"]
# The `ioc-concord` command as a library function (module `cli`): the commands the CONCORD skills run, with their arguments, their output and
# the state they keep. The bindings (feature `uniffi`) export it as `cli_run`.
cli = ["dep:clap"]
# The `uniffi-bindgen` binary, at the version of UniFFI the library is built with, to generate the bindings.
uniffi-cli = ["uniffi", "uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["uniffi-cli"]

[dependencies]
indexmap = { version = "2", features = ["serde"] }
# What the protocol libraries share: the message format (text, XML, the check) and the state storage. The version is for crates.io.
ioc-protocol = { version = "0.1.0", path = "../ioc-protocol-rs" }
# Without the other speed features, for size. `perf-dfa` stays: the size limit of a pattern (schema.rs) counts the lazy DFA of the regex too, so
# which patterns are refused depends on it.
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf-dfa"] }
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1", features = ["v4"] }
uniffi = { version = "0.31", optional = true }
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"], optional = true }

[dev-dependencies]
# the tests compute the check of a document themselves
sha2 = "0.10"
