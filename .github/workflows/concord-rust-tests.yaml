name: concord-rust-tests

on:
  pull_request:
    paths:
      - "packages/ioc-concord-rs/**"
      - "protocols/concord/spec/fixtures/**"
      - ".github/workflows/concord-rust-tests.yaml"
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  concord-rust-library:
    name: concord-rust-library
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ioc-concord-rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - name: Formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps

      - name: Tests
        run: cargo test --locked
