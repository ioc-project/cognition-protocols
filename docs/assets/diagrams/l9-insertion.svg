<text x="44.0" y="397" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="9" fill="#5b6270" text-anchor="start" font-weight="400">relays</text>
<rect x="321.3" y="354.0" width="277.3" height="50.0" fill="#f7f8fa" stroke="#d8dce3" stroke-width="1" rx="6"/>
