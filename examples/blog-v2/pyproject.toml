[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blog-v2"
version = "0.1.0"
description = "Four LLM agents, all in the discussion, decide a hidden-profile task: free speech over a mesh or SLIM, and CONCORD over SLIM."
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "ioc-concord",
    "slim-bindings>=3.3.9",
    "anthropic>=0.40",
    "pyyaml>=6",
]

[tool.uv.sources]
ioc-concord = { path = "../../packages/ioc-concord", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["blog_v2"]
