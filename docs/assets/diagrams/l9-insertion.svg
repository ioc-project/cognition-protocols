<text x="32" y="26" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13.5" fill="#181a20" text-anchor="start" font-weight="600">L9 protocol insertion &#183; where detection taps, and what it can see</text>
<text x="32" y="43" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="10.3" fill="#5b6270" text-anchor="start" font-weight="400">Nothing here changes the application. The further right you tap, the less you can see &#8212; and the later you can act.</text>
<text x="32" y="70" font-family="IBM Plex Mono, Menlo, monospace" font-size="9" fill="#b9762a" text-anchor="start" font-weight="700" letter-spacing="0.6">PART 1 &#8212; DETECTION</text>
