name: validate-skills

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      changed-dirs: ${{ steps.detect.outputs.changed-dirs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: List skill directories
        id: list-skills
        run: |
          dirs="$(find . -mindepth 5 -maxdepth 5 -path './protocols/*/skills/*' -name SKILL.md \
            | xargs -n1 dirname | sed 's#^\./##' | sort | tr '\n' ' ')"
          echo "dirs=${dirs}" >> "$GITHUB_OUTPUT"

      - name: Detect changed skills
        id: detect
        uses: ./.github/actions/detect-changes
        with:
          dirs: ${{ steps.list-skills.outputs.dirs }}

  validate:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.changed-dirs != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        skill: ${{ fromJson(needs.detect-changes.outputs.changed-dirs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install skills-ref
        run: pip install skills-ref

      - name: Validate ${{ matrix.skill }}
        run: agentskills validate "${{ matrix.skill }}"

  update-ai-catalog:
    if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}

      - name: Add new skill versions to ai-catalog.json
        env:
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PYEOF'
          import json, re, os, yaml
          from pathlib import Path
          from datetime import datetime, timezone

          catalog_path = Path("docs/ai-catalog.json")
          manifest_path = Path(".github/release-manifest.json")
          repo = os.environ["REPO"]

          manifest = json.loads(manifest_path.read_text())
          catalog = json.loads(catalog_path.read_text())

          existing = {(e["identifier"], e.get("version")) for e in catalog["entries"]}
          changed = False

          for skill_path, version in manifest.items():
              name = Path(skill_path).name
              identifier = f"urn:ioc-project:ioc-cognition-protocols:skill:{name}"

              if (identifier, version) in existing:
                  continue

              skill_md = Path(skill_path) / "SKILL.md"
              content = skill_md.read_text()
              fm = re.split(r'^---\s*$', content, maxsplit=2, flags=re.MULTILINE)
              data = yaml.safe_load(fm[1])
              description = str(data.get("description", "")).strip()

              tag = f"{name}-v{version}"
              asset_url = f"https://github.com/{repo}/releases/download/{tag}/{name}.zip"
              now = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")

              catalog["entries"].append({
                  "identifier": identifier,
                  "displayName": name,
                  "version": version,
                  "type": "application/agent-skill+zip",
                  "description": description,
                  "tags": ["skill", "claude-code"],
                  "url": asset_url,
                  "updatedAt": now,
                  "publisher": {
                      "identifier": "urn:ioc-project",
                      "displayName": "IoC Project"
                  }
              })
              changed = True
              print(f"Added entry: {identifier} {version}")

          if changed:
              catalog_path.write_text(json.dumps(catalog, indent=2) + "\n")
          else:
              print("No new entries needed")
          PYEOF

      - name: Commit catalog update to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ai-catalog.json
          git diff --cached --quiet && exit 0
          git commit -s -m "chore: update ai-catalog.json for new skill versions [skip ci]"
          git push
