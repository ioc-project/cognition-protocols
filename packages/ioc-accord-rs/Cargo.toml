[package]
name = "ioc-accord"
version = "0.1.0"
edition.workspace = true
rust-version = "1.89"
description = "ACCORD protocol library."
license.workspace = true
readme = "README.md"
repository.workspace = true
keywords = ["accord", "multi-agent", "consensus", "protocol"]
categories = ["algorithms"]

[lib]
name = "ioc_accord"

[dependencies]
indexmap = { version = "2", features = ["serde"] }
# Without the other speed features, for size, as in ioc-concord. The one pattern is the delivery check of a reply (messages.rs).
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf-dfa"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
# v4: the id of a session; v5: the isolated path of a state file under a run key (state::resolve_state_path).
uuid = { version = "1", features = ["v4", "v5"] }
