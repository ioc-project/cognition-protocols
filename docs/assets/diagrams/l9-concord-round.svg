<rect x="448.0" y="202.0" width="440.0" height="46.0" fill="#121418" stroke="#39404a" stroke-width="1" rx="6"/>
<text x="460" y="219" font-family="IBM Plex Mono, Menlo, monospace" font-size="9" fill="#e39a46" text-anchor="start" font-weight="700">SELECT</text>
<text x="510" y="219" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="9.6" fill="#e8eaee" text-anchor="start" font-weight="400">Edge has the best worst case at 0.50 &#8212; still under the bar.</text>
<text x="460" y="235" font-family="IBM Plex Mono, Menlo, monospace" font-size="9" fill="#ec6a68" text-anchor="start" font-weight="700">BOTTLENECK</text>
<text x="538" y="235" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="9.6" fill="#e8eaee" text-anchor="start" font-weight="400">security, so security writes the next option.</text>
<rect x="448.0" y="256.0" width="440.0" height="46.0" fill="#102a1c" stroke="#3cc742" stroke-width="1" rx="6"/>
<text x="460" y="273" font-family="IBM Plex Mono, Menlo, monospace" font-size="9" fill="#3cc742" text-anchor="start" font-weight="700">COMMIT</text>
<text x="518" y="273" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="9.6" fill="#e8eaee" text-anchor="start" font-weight="400">&#8220;public cloud on a private network, in the region closest to users&#8221;</text>
<text x="518" y="289" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="9.6" fill="#9aa3b2" text-anchor="start" font-weight="400">every agent clears 0.60 &#8212; and the winner was nobody&#8217;s first choice.</text>
<line x1="32" y1="394" x2="888" y2="394" stroke="#39404a" stroke-width="1"/>
