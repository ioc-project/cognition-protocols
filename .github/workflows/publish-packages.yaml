name: Publish Python Package

on:
  push:
    tags:
      - "ioc-concord-v*"
      - "ioc-concord-mce-metrics-v*"
      - "ioc-accord-mce-metrics-v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    name: Resolve package from tag
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.resolve.outputs.name }}
      path: ${{ steps.resolve.outputs.path }}
    steps:
      - name: Resolve package
        id: resolve
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          packages = [
              ("ioc-accord-mce-metrics", "protocols/accord/mce-metrics"),
              ("ioc-concord-mce-metrics", "protocols/concord/mce-metrics"),
              ("ioc-concord", "packages/ioc-concord-python"),
          ]
          tag = os.environ["TAG"]
          for name, path in packages:
              if tag.startswith(name + "-v"):
                  print(f"name={name}")
                  print(f"path={path}")
                  break
          PY

  # ioc-concord has native code: its wheels are built and tested on every platform (concord-python.yaml) before they are published
  wheels:
    name: Wheels of ioc-concord
    needs: resolve
    if: needs.resolve.outputs.name == 'ioc-concord'
    uses: ./.github/workflows/concord-python.yaml

  publish:
    name: Build and publish ${{ needs.resolve.outputs.name }}
    needs: [resolve, wheels]
    if: ${{ !cancelled() && needs.resolve.result == 'success' && (needs.wheels.result == 'success' || needs.wheels.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment:
      name: pypi-${{ needs.resolve.outputs.name }}
    permissions:
      contents: read
      actions: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      # `uv build --sdist` packages the crate with cargo
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache: false

      - name: Build package
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ needs.resolve.outputs.name }}
          PACKAGE_PATH: ${{ needs.resolve.outputs.path }}
        run: |
          if [ "$NAME" = "ioc-concord" ]; then
            # the wheels the platform jobs built and tested, and the source distribution
            gh run download "$GITHUB_RUN_ID" --pattern 'ioc-concord-wheel-*' --dir "$RUNNER_TEMP/wheels"
            mkdir -p "$PACKAGE_PATH/dist"
            find "$RUNNER_TEMP/wheels" -name '*.whl' -exec mv {} "$PACKAGE_PATH/dist/" \;
            uv build --sdist --directory "$PACKAGE_PATH"
          else
            uv build --directory "$PACKAGE_PATH"
          fi

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: ${{ needs.resolve.outputs.path }}/dist/
          skip-existing: true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ needs.resolve.outputs.name }}-${{ github.sha }}
          path: ${{ needs.resolve.outputs.path }}/dist/*
          retention-days: 30
