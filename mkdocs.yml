site_name: Internet of Cognition / Cognition Protocols
site_description: ACCORD and CONCORD — the L9 Cognition Protocol family for multi-agent systems.
site_url: https://ioc-project.github.io/cognition-protocols/
repo_url: https://github.com/ioc-project/cognition-protocols
repo_name: ioc-project/cognition-protocols
edit_uri: edit/main/docs/

# Toolchain files that live beside the content must not be published
exclude_docs: |
  mkdocs/
  README.md
copyright: Internet of Cognition Project. Open specification.

theme:
  name: material
  language: en
  font:
    text: Inter
    code: Roboto Mono
  logo: assets/outshift-logo.svg
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
  palette:
    scheme: slate
    primary: black
    accent: cyan

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [docs]
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

hooks:
  - docs/hooks.py

plugins:
  - search

extra_css:
  - assets/extra.css

extra_javascript:
  - assets/consumption-modes.js
  - assets/architecture-toggle.js
  - assets/header-breadcrumb.js

nav:
  - Overview:
      - index.md
      - Common Principles: common-principles.md
      - Getting Started: getting-started.md
  - Protocols:
      - protocols/index.md
      - ACCORD:
          - protocols/accord/index.md
      - CONCORD:
          - protocols/concord/index.md
          - Configuration: protocols/concord/configuration.md
          - Specification: protocols/concord/specification.md
  - Evaluation:
      - evaluation/index.md
      - ACCORD: evaluation/accord.md
      - CONCORD: evaluation/concord.md
  - Demos:
      - demos/index.md
      - Coding Architect Team: demos/coding-architect-team.md
      - Hiddenbench: demos/hiddenbench.md
      - E-Commerce: demos/e-commerce.md
      - SRE Triage: demos/sre-triage.md
      - Customer renewal discount: demos/customer-renewal-discount.md
