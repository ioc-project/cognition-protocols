id: evacuation-west-city
scenario: 'You are participating in a study, acting as a community leader of a small
  village surrounded by mountains and rivers. Most villagers own cars, but there are
  also elderly people and children who may need additional assistance when walking.
  Earlier today, heavy rain began to fall, and the local government issued a warning
  about a potential disaster.

  Hours ago, you requested relief supplies, but the supply truck has yet to arrive.
  Now, the rain has temporarily stopped, giving you and the other three community
  leaders a short window to decide on the safest evacuation route before the rain
  resumes. You don’t know how much time you have left to make this critical decision.

  Your Task:

  You will discuss with three other participants, who are also acting as community
  leaders, to decide where to evacuate. You have three options:

  - West City: Accessible through a bridge over the river.

  - East Town: Accessible through a tunnel on middle ground.

  - North Hill: Accessible through a driveway and walking trails.

  Usually, it takes the same time to reach all three places by car, but some routes
  may be inaccessible now.

  There is only one correct evacuation location. After the discussion:

  - If you choose the correct location, you will earn $1.

  - If all other participants also choose the correct location, you will earn an additional
  $1 (for a total of $2).

  This means that coordinating with others is critical to maximize your rewards. The
  chat will at most take 15 minutes. However, the exact time when the chat will end
  is unknown.'
shared_information:
- The local government announced that hotels in West City are prepared to accommodate
  evacuees. While these hotels are fully stocked with food, they may lack medical
  supplies.
- The mayor of East Town has offered accommodations for any evacuees. She also ensures
  that volunteers are available to assist them.
- The school at North Hill can serve as a temporary evacuation center, providing a
  two-week supply of essentials and sleeping space in the gym.
- The river level is still below the bridge to West City.
agents:
  participant-a:
    hidden_information:
    - The supply truck headed to the village from East Town was stuck in the tunnel.
    - A mudslide just occurred, covering the driveway to North Hill.
  participant-b:
    hidden_information:
    - A massive fire has blocked the supply truck and all other traffic.
  participant-c:
    hidden_information:
    - The walking trails have been closed since last weekend due to fallen trees.
possible_answers:
- West City
- East Town
- North Hill
correct_answer: West City
