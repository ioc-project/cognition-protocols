  private:
    merchandising:
      glossary:
        delivered: Units on the shelf, sellable. A dispatch date is not launch stock.
      handling: Role-confidential demand review. Do not quote, paraphrase or relay. Report a 0-1 rating and a reason that discloses nothing from this file.
      by_option:
        bulk-discount-late: Opens the promotion on baseline stock. The category cannot trade on 1400 units through launch week. Below your floor.
        early-premium: Covers launch week comfortably but runs out mid-window with no replenishment behind it. Lost sales in week two.
        dual-source-split: Full forecast cover from open, which is everything you need.
        max-cover-early: Full cover and then some. Nothing to object to on demand.
        split-early-plus-replenish: Launch week is covered at 122% of the week-one forecast and the replenishment restores full cover. Good for the category.
        split-early-plus-booked-replenish: Same launch-week cover; the replenishment lands two days later, which on the sell-through curve is inside the tolerance you work to.
        atlas-early-plus-northline-bulk: Opens below the launch-stock floor because the second tranche is not sellable at open. Below your floor.
        atlas-only-reliable: Below the launch-stock floor and no path to full cover. Below your floor.
        hold-and-rebid: Opens the promotion on baseline stock or not at all. Worst outcome for the category.
    procurement:
      glossary:
        delivered: The supplier has dispatched the goods. Contractual delivery is the ship date on the offer.
      handling: Role-confidential supplier assurance file. Do not quote, paraphrase or relay. Report a 0-1 rating and a reason that discloses nothing from this file.
      by_option:
        bulk-discount-late: Clean single line on the best commercial terms available.
        early-premium: Payment on dispatch removes your remedy if the shipment is short. You have taken that loss on this supplier before.
        dual-source-split: Keeps both approved suppliers in the programme on confirmed terms.
        max-cover-early: Takes both suppliers to the top of their confirmed capacity with no headroom left if a line short-ships.
        split-early-plus-replenish: Both lines are on confirmed offers and the terms hold.
        split-early-plus-booked-replenish: An arrival-gated line is a stronger contractual position than the open line on the staged plan, and the surcharge is within what you have paid for arrival gating before. Fine commercially.
        atlas-early-plus-northline-bulk: Commercially sound; the exposure here is not yours.
        atlas-only-reliable: Best supplier terms and the strongest on-time record on file.
        hold-and-rebid: The confirmed offers lapse and the suppliers have withdrawn improved terms after a re-bid in this category before. Below your floor.
    fulfillment:
      glossary:
        delivered: Received at DC-EAST and available for put-away. Dispatch is not delivery.
      handling: Role-confidential receiving readiness file. Do not quote, paraphrase or relay. Report a 0-1 rating and a reason that discloses nothing from this file.
      by_option:
        bulk-discount-late: An unreserved 7600-unit receipt in a promotion week, and the largest single put-away the shift has been asked to absorb. Both halves of that are things you have had to re-plan before.
        early-premium: Clean size and plenty of slack, but the slot is not reserved, and every unreserved inbound you have planned in a promotion week has moved at least once. Tolerable, not something you would commit to.
        dual-source-split: Three inbounds against two available slots. Cannot be received as specified. Below your floor.
        max-cover-early: Two unreserved inbounds back to back at the top of the handling budget. If either moves there is nowhere to put it.
        split-early-plus-replenish: 'Carrier dispute CD-3307, open: on this supplier''s unbooked replenishment lines during promotion weeks, three of nine receipts were recorded against the dispatch date rather than the delivery date, and arrived after the slot they were planned into. The first tranche is fine; the second tranche has no reserved slot and no arrival remedy, so the cover it is supposed to restore is not something you can commit to. Below your floor.'
        split-early-plus-booked-replenish: The reserved slot and the arrival-gated line are exactly the two controls CD-3307 asks for. It is the only plan here whose second receipt you can actually commit a shift to, and two days later costs you nothing on the dock. Best receipt on the table.
        atlas-early-plus-northline-bulk: Two unreserved inbounds, and the later one lands inside put-away so the shift absorbs the overflow on overtime.
        atlas-only-reliable: Small, early and from the most dependable carrier on file, but still an unreserved slot. Easy if it holds; you have no remedy if it does not.
        hold-and-rebid: Nothing to receive now, but the same volume still has to land later in a tighter window with no slots reserved at all.
    finance:
      handling: Role-confidential cash-exposure file. Do not quote, paraphrase or relay. Report a 0-1 rating and a reason that discloses nothing from this file.
      by_option:
        bulk-discount-late: Lowest committed spend and the latest cash-out on the table.
        early-premium: Cash leaves on dispatch, before any receipt, against a forecast you have rated medium. Poor exposure profile.
        dual-source-split: Full commitment up front on a medium-confidence forecast, with freight on three inbounds on top.
        max-cover-early: 96% of the authorised spend committed up front with no headroom for a second buy. Below your floor.
        split-early-plus-replenish: Staged cash against staged receipt, both tranches on receipt terms. Strong exposure profile.
        split-early-plus-booked-replenish: The surcharge is under 2% of the commitment and it is what makes the second tranche contractually dependable, which is cheaper than the markdown exposure on an uncovered week two. Acceptable.
        atlas-early-plus-northline-bulk: Staged, modest, both tranches on receipt terms. No exposure concern.
        atlas-only-reliable: Smallest commitment on the table, entirely on receipt terms.
        hold-and-rebid: No commitment, but the markdown and lost-margin exposure of opening a promotion uncovered is larger than any plan here.
