[package]
name = "ioc-concord"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "CONCORD protocol library."
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/ioc-project/cognition-protocols"
keywords = ["concord", "multi-agent", "negotiation", "protocol"]
categories = ["algorithms"]

[lib]
crate-type = ["lib", "cdylib"]

[features]
# The API for other languages (Python, Go, JavaScript, ...), through UniFFI: module `ffi`. Without it this is a plain Rust crate.
uniffi = ["dep:uniffi"]
# The `uniffi-bindgen` binary, at the version of UniFFI the library is built with, to generate the bindings.
uniffi-cli = ["uniffi", "uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["uniffi-cli"]

[dependencies]
indexmap = { version = "2", features = ["serde"] }
regex = "1"
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
# `float_roundtrip`: a number read from a state file is exactly the number written (the default parser can be one unit of the last place off,
# and on some targets it is: a timer of a state would change at each save)
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
uniffi = { version = "0.31", optional = true }

# The library ships inside wheels: size over speed.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
