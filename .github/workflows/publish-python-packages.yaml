name: Publish Python Package

on:
  push:
    tags:
      - "ioc-concord-v*"
      - "ioc-concord-mce-metrics-v*"
      - "ioc-accord-mce-metrics-v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    name: Resolve package from tag
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.resolve.outputs.name }}
      path: ${{ steps.resolve.outputs.path }}
    steps:
      - name: Resolve package
        id: resolve
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          packages = [
              ("ioc-accord-mce-metrics", "protocols/accord/mce-metrics"),
              ("ioc-concord-mce-metrics", "protocols/concord/mce-metrics"),
              ("ioc-concord", "packages/ioc-concord"),
          ]
          tag = os.environ["TAG"]
          for name, path in packages:
              if tag.startswith(name + "-v"):
                  print(f"name={name}")
                  print(f"path={path}")
                  break
          PY

  publish:
    name: Build and publish ${{ needs.resolve.outputs.name }}
    needs: resolve
    runs-on: ubuntu-latest
    environment:
      name: pypi-${{ needs.resolve.outputs.name }}
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Build package
        run: uv build --directory "${{ needs.resolve.outputs.path }}"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ needs.resolve.outputs.path }}/dist/
          skip-existing: true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ needs.resolve.outputs.name }}-${{ github.sha }}
          path: ${{ needs.resolve.outputs.path }}/dist/*
          retention-days: 30
