name: concord-tests

on:
  pull_request:
    paths:
      - "protocols/concord/skills/**"
      - "protocols/concord/shared/**"
      - "protocols/concord/tests/**"
      - ".github/workflows/concord-tests.yaml"
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  concord-tests:
    name: concord-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install pytest
        run: pip install pytest

      - name: Replay the scripted runs
        run: python -m pytest protocols/concord/tests -q
