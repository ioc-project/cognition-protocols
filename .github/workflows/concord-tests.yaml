name: concord-tests

# Three jobs that run side by side, so that a failure in one does not hide the others:
#   concord-bundler  the bundler's own tests
#   concord-cli      the command line that the two skill scripts share (protocols/concord/cli), as it is on disk
#   concord-scripts  the skill scripts as they are checked in
# The library itself is tested by concord-rust-tests.yaml and concord-python.yaml.
# That the scripts carry the library revision they are pinned to is `check-sync` (validate-skills.yaml).

on:
  pull_request:
    paths:
      - "protocols/concord/skills/**"
      - "protocols/concord/cli/**"
      - "protocols/concord/tests/**"
      - "protocols/concord/spec/fixtures/**"
      - "tools/**"
      - ".github/workflows/concord-tests.yaml"
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  concord-bundler:
    name: concord-bundler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install pytest
        run: pip install pytest

      - name: Bundler
        run: python -m pytest tools -q

  concord-cli:
    name: concord-cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      # The pure-Python library the scripts bundle is no longer on main: the tests take its last release from PyPI.
      - name: Install pytest and the pure-Python library
        run: pip install pytest "ioc-concord==0.2.0"

      # The tests put the command line on the path themselves: they test it as it is on disk.
      - name: Shared command line
        run: python -m pytest protocols/concord/cli/tests -q

  concord-scripts:
    name: concord-scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      # Only pytest: the scripts carry what they use of the library, and must run without it installed.
      - name: Install pytest
        run: pip install pytest

      - name: Scripts
        run: python -m pytest protocols/concord/tests -q
