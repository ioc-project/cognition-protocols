<svg viewBox="0 0 920 452" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif"><rect x="0" y="0" width="920" height="452" fill="#000000"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9aa3b2"/></marker><marker id="ahx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e39a46"/></marker></defs>
<rect width="920" height="452" fill="#0a0a0a"/>
<text x="32" y="26" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13.5" fill="#e8eaee" text-anchor="start" font-weight="600">CONCORD &#183; one round, worked</text>
<text x="32" y="43" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="10.3" fill="#9aa3b2" text-anchor="start" font-weight="400">Three agents must place one new service. Each is right; their first choices conflict. Bar &#964; = 0.60.</text>
<rect x="32.0" y="68.0" width="330.0" height="54.0" fill="#121418" stroke="#39404a" stroke-width="1" rx="6"/>
<text x="45" y="89" font-family="IBM Plex Mono, Menlo, monospace" font-size="13" fill="#39404a" text-anchor="start" font-weight="700">1</text>
<text x="62" y="89" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="11" fill="#e8eaee" text-anchor="start" font-weight="700" letter-spacing="0.3">INITIALIZE</text>
<text x="62" y="104" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="9.4" fill="#9aa3b2" text-anchor="start" font-weight="400">two shared anchors rescale every agent&#8217;s private</text>
<text x="62" y="116" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="9.4" fill="#9aa3b2" text-anchor="start" font-weight="400">scale onto one bar</text>
<line x1="197.0" y1="123.0" x2="197.0" y2="130.0" stroke="#9aa3b2" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="32.0" y="131.0" width="330.0" height="54.0" fill="#121418" stroke="#39404a" stroke-width="1" rx="6"/>
<text x="45" y="152" font-family="IBM Plex Mono, Menlo, monospace" font-size="13" fill="#39404a" text-anchor="start" font-weight="700">2</text>
<text x="62" y="152" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="11" fill="#e8eaee" text-anchor="start" font-weight="700" letter-spacing="0.3">PROPOSE + SCORE</text>
<text x="62" y="167" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="9.4" fill="#9aa3b2" text-anchor="start" font-weight="400">one proposal per agent; everyone scores every</text>
<text x="62" y="179" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="9.4" fill="#9aa3b2" text-anchor="start" font-weight="400">proposal</text>
<line x1="197.0" y1="186.0" x2="197.0" y2="193.0" stroke="#9aa3b2" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="32.0" y="194.0" width="330.0" height="54.0" fill="#2a2112" stroke="#e39a46" stroke-width="1" rx="6"/>
<text x="45" y="215" font-family="IBM Plex Mono, Menlo, monospace" font-size="13" fill="#e39a46" text-anchor="start" font-weight="700">3</text>
<text x="62" y="215" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="11" fill="#e8eaee" text-anchor="start" font-weight="700" letter-spacing="0.3">SELECT</text>
<text x="62" y="230" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="9.4" fill="#9aa3b2" text-anchor="start" font-weight="400">take the option whose worst-off agent is best</text>
<text x="62" y="242" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="9.4" fill="#9aa3b2" text-anchor="start" font-weight="400">off</text>
<line x1="197.0" y1="249.0" x2="197.0" y2="256.0" stroke="#9aa3b2" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="32.0" y="257.0" width="330.0" height="54.0" fill="#2a2112" stroke="#e39a46" stroke-width="1" rx="6"/>
<text x="45" y="278" font-family="IBM Plex Mono, Menlo, monospace" font-size="13" fill="#e39a46" text-anchor="start" font-weight="700">4</text>
<text x="62" y="278" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="11" fill="#e8eaee" text-anchor="start" font-weight="700" letter-spacing="0.3">REPAIR</text>
<text x="62" y="293" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="9.4" fill="#9aa3b2" text-anchor="start" font-weight="400">the least-satisfied agent &#8212; and only it &#8212; writes</text>
<text x="62" y="305" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="9.4" fill="#9aa3b2" text-anchor="start" font-weight="400">the next option</text>
<line x1="197.0" y1="312.0" x2="197.0" y2="319.0" stroke="#9aa3b2" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="32.0" y="320.0" width="330.0" height="54.0" fill="#121418" stroke="#39404a" stroke-width="1" rx="6"/>
<text x="45" y="341" font-family="IBM Plex Mono, Menlo, monospace" font-size="13" fill="#39404a" text-anchor="start" font-weight="700">5</text>
<text x="62" y="341" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="11" fill="#e8eaee" text-anchor="start" font-weight="700" letter-spacing="0.3">STOP</text>
<text x="62" y="356" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="9.4" fill="#9aa3b2" text-anchor="start" font-weight="400">commit when everyone clears the bar, or report</text>
<text x="62" y="368" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="9.4" fill="#9aa3b2" text-anchor="start" font-weight="400">who does not</text>
