name: concord-tests

# Two jobs that run side by side, so that a failure in one does not hide the others:
#   concord-bundler  the bundler's own tests
#   concord-scripts  the skill scripts as they are checked in
# The library itself is tested by concord-rust-tests.yaml.
# That the scripts carry the library revision they are pinned to is `check-sync` (validate-skills.yaml).

on:
  pull_request:
    paths:
      - "protocols/concord/skills/**"
      - "protocols/concord/tests/**"
      - "tools/**"
      - ".github/workflows/concord-tests.yaml"
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  concord-bundler:
    name: concord-bundler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install pytest
        run: pip install pytest

      - name: Bundler
        run: python -m pytest tools -q

  concord-scripts:
    name: concord-scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install pytest
        run: pip install pytest

      - name: Scripts
        run: python -m pytest protocols/concord/tests -q
