<rect x="44.0" y="282.0" width="120.1" height="16" fill="#9aa0ad" rx="3"/><text x="104.05000000000001" y="293.8" font-family="IBM Plex Mono, Menlo, monospace" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="600">Async observability</text>
<text x="174.10000000000002" y="294" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="9.8" fill="#181a20" text-anchor="start" font-weight="400">an external platform watches traces across every agent and injects a trigger when it sees a failure</text>
<text x="44" y="316" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="9.2" fill="#5b6270" text-anchor="start" font-weight="400">The only option that catches what no single message contains &#8212; cross-agent drift, herding, long-horizon misalignment. It fires after the fact.</text>
