<text x="32" y="314" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="9.8" fill="#e8eaee" text-anchor="start" font-weight="400">On three of the four, round 1 already cleared the floor for every agent, so no repair round was needed.</text>
<text x="32" y="329" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="9.8" fill="#e39a46" text-anchor="start" font-weight="400">On the e-commerce promotion 80% of runs went further, with the bottleneck agent authoring an option nobody had brought. Same protocol, same floor, different problem.</text>
