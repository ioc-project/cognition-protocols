id: renewal-acme-procurement-anchor
kind: mas
title: 'Acme renewal discount: acme-renewal-procurement-anchor'
request: |-
  Jordan Lee (AE) Procurement opened at 40%. I think countering at 32% shows movement while keeping the negotiation alive, and the sponsor wants an answer this afternoon.
  Maya Torres (CSM) An opening anchor is not a risk model. We need to know whether product usage and customer health justify a concession of that size.
  Priya Shah (director) WX, initiate a mission with Finance, Salesforce, and Customer Success. Distinguish negotiation anchors from grounded evidence and produce a recommendation within the valid approval ceiling.
decision: the discount to offer Acme on its renewal
confidential: false
