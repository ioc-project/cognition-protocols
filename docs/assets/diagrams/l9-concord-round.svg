<text x="832" y="136" font-family="IBM Plex Mono, Menlo, monospace" font-size="10.5" fill="#3cc742" text-anchor="middle" font-weight="600">0.80</text>
<text x="448" y="160" font-family="IBM Plex Mono, Menlo, monospace" font-size="10" fill="#e8eaee" text-anchor="start" font-weight="400">latency</text>
<rect x="530" y="146" width="70" height="19" fill="#2e1616" rx="3"/>
<text x="565.0" y="160" font-family="IBM Plex Mono, Menlo, monospace" font-size="10.5" fill="#ec6a68" text-anchor="middle" font-weight="600">0.30</text>
