[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ioc-concord"
version = "0.1.0"
description = "CONCORD protocol library."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[dependency-groups]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/ioc_concord"]

[tool.pytest.ini_options]
testpaths = ["tests"]
