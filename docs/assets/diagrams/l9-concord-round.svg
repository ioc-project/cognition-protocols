<text x="376" y="214.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="9" fill="#e39a46" text-anchor="start" font-weight="600">&#8804; B</text>
<text x="448" y="60" font-family="IBM Plex Mono, Menlo, monospace" font-size="9" fill="#e39a46" text-anchor="start" font-weight="700" letter-spacing="0.5">EVERYONE SCORES EVERY PROPOSAL</text>
<text x="565.0" y="74" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="9" fill="#9aa3b2" text-anchor="middle" font-weight="400">Private cloud</text>
<text x="651.0" y="74" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="9" fill="#9aa3b2" text-anchor="middle" font-weight="400">Cheapest</text>
