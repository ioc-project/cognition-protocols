<svg viewBox="0 0 900 408" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif"><rect x="0" y="0" width="900" height="408" fill="#000000"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9aa3b2"/></marker><marker id="ahx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e39a46"/></marker></defs>
<rect width="900" height="408" fill="#0a0a0a"/>
<text x="32" y="26" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13.5" fill="#e8eaee" text-anchor="start" font-weight="600">ACCORD &#183; five phases, one engine</text>
<text x="32" y="43" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="10.3" fill="#9aa3b2" text-anchor="start" font-weight="400">Runs once before any work begins. Every phase gathers, merges, covers, then closes on a barrier.</text>
<rect x="32.0" y="58.0" width="836.0" height="28.0" fill="#171b21" stroke="#171b21" stroke-width="1" rx="6"/>
<text x="44" y="76" font-family="IBM Plex Mono, Menlo, monospace" font-size="9" fill="#e39a46" text-anchor="start" font-weight="700">INPUT</text>
<text x="94" y="76" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="10.5" fill="#e8eaee" text-anchor="start" font-weight="400">one task, and N agents that each hold a partial, private view of it</text>
<rect x="32.0" y="104.0" width="198.5" height="150.0" fill="#121418" stroke="#39404a" stroke-width="1" rx="6"/>
<text x="44.0" y="126" font-family="IBM Plex Mono, Menlo, monospace" font-size="15" fill="#39404a" text-anchor="start" font-weight="700">1</text>
<text x="64.0" y="126" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="12" fill="#e39a46" text-anchor="start" font-weight="700" letter-spacing="0.4">CONVENE</text>
<text x="44.0" y="148" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="10" fill="#e8eaee" text-anchor="start" font-weight="400">Who is here, and what can they</text>
<text x="44.0" y="161" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="10" fill="#e8eaee" text-anchor="start" font-weight="400">do?</text>
<line x1="44.0" y1="180" x2="218.5" y2="180" stroke="#39404a" stroke-width="1"/>
<text x="44.0" y="196" font-family="IBM Plex Mono, Menlo, monospace" font-size="8.4" fill="#9aa3b2" text-anchor="start" font-weight="600" letter-spacing="0.5">merge</text>
<text x="44.0" y="209" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="9.3" fill="#9aa3b2" text-anchor="start" font-weight="400">agent cards &#8594; set union</text>
<text x="44.0" y="228" font-family="IBM Plex Mono, Menlo, monospace" font-size="8.4" fill="#9aa3b2" text-anchor="start" font-weight="600" letter-spacing="0.5">prevents</text>
<rect x="44.0" y="234.0" width="31.6" height="14" fill="#58a2f5" rx="3"/><text x="59.8" y="243.8" font-family="IBM Plex Mono, Menlo, monospace" font-size="8.5" fill="#0a0a0a" text-anchor="middle" font-weight="600">DE-1</text>
<rect x="80.6" y="234.0" width="31.6" height="14" fill="#58a2f5" rx="3"/><text x="96.39999999999999" y="243.8" font-family="IBM Plex Mono, Menlo, monospace" font-size="8.5" fill="#0a0a0a" text-anchor="middle" font-weight="600">CC-1</text>
<line x1="231.5" y1="179.0" x2="242.5" y2="179.0" stroke="#9aa3b2" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="244.5" y="104.0" width="198.5" height="150.0" fill="#121418" stroke="#39404a" stroke-width="1" rx="6"/>
<text x="256.5" y="126" font-family="IBM Plex Mono, Menlo, monospace" font-size="15" fill="#39404a" text-anchor="start" font-weight="700">2</text>
<text x="276.5" y="126" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="12" fill="#e39a46" text-anchor="start" font-weight="700" letter-spacing="0.4">FRAME</text>
<text x="256.5" y="148" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="10" fill="#e8eaee" text-anchor="start" font-weight="400">What is the task, fully</text>
<text x="256.5" y="161" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="10" fill="#e8eaee" text-anchor="start" font-weight="400">stated?</text>
<line x1="256.5" y1="180" x2="431.0" y2="180" stroke="#39404a" stroke-width="1"/>
<text x="256.5" y="196" font-family="IBM Plex Mono, Menlo, monospace" font-size="8.4" fill="#9aa3b2" text-anchor="start" font-weight="600" letter-spacing="0.5">merge</text>
<text x="256.5" y="209" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="9.3" fill="#9aa3b2" text-anchor="start" font-weight="400">statements &#8594; grouped, with support</text>
<text x="256.5" y="228" font-family="IBM Plex Mono, Menlo, monospace" font-size="8.4" fill="#9aa3b2" text-anchor="start" font-weight="600" letter-spacing="0.5">prevents</text>
<rect x="256.5" y="234.0" width="31.6" height="14" fill="#ec6a68" rx="3"/><text x="272.3" y="243.8" font-family="IBM Plex Mono, Menlo, monospace" font-size="8.5" fill="#0a0a0a" text-anchor="middle" font-weight="600">CR-1</text>
<line x1="444.0" y1="179.0" x2="455.0" y2="179.0" stroke="#9aa3b2" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="457.0" y="104.0" width="198.5" height="150.0" fill="#121418" stroke="#39404a" stroke-width="1" rx="6"/>
<text x="469.0" y="126" font-family="IBM Plex Mono, Menlo, monospace" font-size="15" fill="#39404a" text-anchor="start" font-weight="700">3</text>
<text x="489.0" y="126" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="12" fill="#e39a46" text-anchor="start" font-weight="700" letter-spacing="0.4">GROUND</text>
<text x="469.0" y="148" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="10" fill="#e8eaee" text-anchor="start" font-weight="400">Do we call the same things the</text>
<text x="469.0" y="161" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="10" fill="#e8eaee" text-anchor="start" font-weight="400">same way?</text>
<line x1="469.0" y1="180" x2="643.5" y2="180" stroke="#39404a" stroke-width="1"/>
<text x="469.0" y="196" font-family="IBM Plex Mono, Menlo, monospace" font-size="8.4" fill="#9aa3b2" text-anchor="start" font-weight="600" letter-spacing="0.5">merge</text>
<text x="469.0" y="209" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="9.3" fill="#9aa3b2" text-anchor="start" font-weight="400">terms &#8594; linked, or split + flagged</text>
<text x="469.0" y="228" font-family="IBM Plex Mono, Menlo, monospace" font-size="8.4" fill="#9aa3b2" text-anchor="start" font-weight="600" letter-spacing="0.5">prevents</text>
<rect x="469.0" y="234.0" width="31.6" height="14" fill="#ec6a68" rx="3"/><text x="484.8" y="243.8" font-family="IBM Plex Mono, Menlo, monospace" font-size="8.5" fill="#0a0a0a" text-anchor="middle" font-weight="600">DR-1</text>
<line x1="656.5" y1="179.0" x2="667.5" y2="179.0" stroke="#9aa3b2" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="669.5" y="104.0" width="198.5" height="150.0" fill="#121418" stroke="#39404a" stroke-width="1" rx="6"/>
<text x="681.5" y="126" font-family="IBM Plex Mono, Menlo, monospace" font-size="15" fill="#39404a" text-anchor="start" font-weight="700">4</text>
<text x="701.5" y="126" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="12" fill="#e39a46" text-anchor="start" font-weight="700" letter-spacing="0.4">VERIFY</text>
<text x="681.5" y="148" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="10" fill="#e8eaee" text-anchor="start" font-weight="400">Who knows what, and how is</text>
<text x="681.5" y="161" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="10" fill="#e8eaee" text-anchor="start" font-weight="400">&#8220;done&#8221; checked?</text>
<line x1="681.5" y1="180" x2="856.0" y2="180" stroke="#39404a" stroke-width="1"/>
<text x="681.5" y="196" font-family="IBM Plex Mono, Menlo, monospace" font-size="8.4" fill="#9aa3b2" text-anchor="start" font-weight="600" letter-spacing="0.5">merge</text>
<text x="681.5" y="209" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="9.3" fill="#9aa3b2" text-anchor="start" font-weight="400">knowledge, checks &#8594; coverage</text>
<text x="681.5" y="228" font-family="IBM Plex Mono, Menlo, monospace" font-size="8.4" fill="#9aa3b2" text-anchor="start" font-weight="600" letter-spacing="0.5">prevents</text>
<rect x="681.5" y="234.0" width="31.6" height="14" fill="#58a2f5" rx="3"/><text x="697.3" y="243.8" font-family="IBM Plex Mono, Menlo, monospace" font-size="8.5" fill="#0a0a0a" text-anchor="middle" font-weight="600">DE-1</text>
<rect x="718.1" y="234.0" width="31.6" height="14" fill="#58a2f5" rx="3"/><text x="733.9" y="243.8" font-family="IBM Plex Mono, Menlo, monospace" font-size="8.5" fill="#0a0a0a" text-anchor="middle" font-weight="600">CE-1</text>
<line x1="450.0" y1="256" x2="450.0" y2="278" stroke="#9aa3b2" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="32.0" y="280.0" width="836.0" height="30.0" fill="#2a2112" stroke="#e39a46" stroke-width="1" rx="6"/>
<text x="44" y="300" font-family="IBM Plex Mono, Menlo, monospace" font-size="15" fill="#39404a" text-anchor="start" font-weight="700">5</text><text x="62" y="300" font-family="IBM Plex Mono, Menlo, monospace" font-size="10" fill="#e39a46" text-anchor="start" font-weight="700" letter-spacing="0.6">LOCK</text>
<text x="94" y="300" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="10.3" fill="#e8eaee" text-anchor="start" font-weight="400">quorum commit &#8212; anything still flagged blocks only the criteria that depend on it</text>
<text x="32" y="340" font-family="IBM Plex Mono, Menlo, monospace" font-size="9" fill="#e39a46" text-anchor="start" font-weight="700">OUTPUT</text>
<rect x="94.0" y="328.0" width="43.4" height="16" fill="#e8eaee" rx="3"/><text x="115.7" y="339.8" font-family="IBM Plex Mono, Menlo, monospace" font-size="9" fill="#0a0a0a" text-anchor="middle" font-weight="600">Roster</text>
<rect x="143.4" y="328.0" width="84.7" height="16" fill="#e8eaee" rx="3"/><text x="185.75" y="339.8" font-family="IBM Plex Mono, Menlo, monospace" font-size="9" fill="#0a0a0a" text-anchor="middle" font-weight="600">Problem Frame</text>
<rect x="234.1" y="328.0" width="55.2" height="16" fill="#e8eaee" rx="3"/><text x="261.70000000000005" y="339.8" font-family="IBM Plex Mono, Menlo, monospace" font-size="9" fill="#0a0a0a" text-anchor="middle" font-weight="600">Glossary</text>
<rect x="295.3" y="328.0" width="126.0" height="16" fill="#e8eaee" rx="3"/><text x="358.3" y="339.8" font-family="IBM Plex Mono, Menlo, monospace" font-size="9" fill="#0a0a0a" text-anchor="middle" font-weight="600">Verifiable Objective</text>
<text x="433.3" y="340" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="10" fill="#9aa3b2" text-anchor="start" font-weight="400">= the locked Intent Contract, CONCORD&#8217;s precondition</text>
<line x1="32" y1="366" x2="868" y2="368" stroke="#39404a" stroke-width="1"/>
<text x="32" y="384" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="9.6" fill="#e8eaee" text-anchor="start" font-weight="400">No negotiation. Nobody votes or averages &#8212; a genuine conflict is kept and flagged, never overruled.</text>
<text x="32" y="397" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="9.6" fill="#9aa3b2" text-anchor="start" font-weight="400">During work, a scoped delta re-covers only what changed, rather than re-convening the session.</text>
</svg>