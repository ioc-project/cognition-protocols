name: Publish Package

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish"
        required: true
        type: choice
        options:
          - all
          - ioc-accord-mce-metrics
          - ioc-concord-mce-metrics
      publish:
        description: "Upload artifacts to public PyPI"
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "package-v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Select packages
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Select packages to publish
        id: select
        env:
          INPUT: ${{ github.event.inputs.package || 'all' }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          packages = [
              ("ioc-accord-mce-metrics", "protocols/accord/mce-metrics"),
              ("ioc-concord-mce-metrics", "protocols/concord/mce-metrics"),
          ]
          sel = os.environ["INPUT"]
          main = [
              {"name": n, "path": p}
              for n, p in packages
              if sel == "all" or sel == n
          ]
          print("matrix=" + json.dumps({"include": main}))
          PY

  publish:
    needs: plan
    runs-on: ubuntu-latest
    # One GitHub environment per package (pypi-<name>), so each PyPI project
    # can have its own trusted publisher and protection rules.
    environment:
      name: pypi-${{ matrix.name }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install build tools
        run: |
          uv tool install build
          uv tool install twine

      - name: Build package
        run: pyproject-build "${{ matrix.path }}"

      - name: Check package
        run: uvx twine check "${{ matrix.path }}/dist/"*

      - name: Publish to PyPI
        if: github.event_name == 'push' || inputs.publish == true
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ matrix.path }}/dist/
          skip-existing: true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}-${{ github.sha }}
          path: ${{ matrix.path }}/dist/*
          retention-days: 30
